    let currentTab = 'task1';
    let currentExerciseIndex = 0;
    let userAnswers = {};

    function initApp() {
        renderSidebar();
        loadExercise(0);
        lucide.createIcons();
    }

    function switchMainTab(tab) {
        currentTab = tab;
        const btnT1 = document.getElementById('btnTask1');
        const btnT2 = document.getElementById('btnTask2');
        const btnT3 = document.getElementById('btnTask3');
        const sidebar = document.getElementById('sidebarNav');
        const contentArea = document.getElementById('contentArea');
        const footer = document.getElementById('exerciseFooter');

        const activeClass = "px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-white text-indigo-600 shadow-sm flex items-center gap-1.5";
        const inactiveClass = "px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-indigo-700/60 text-white hover:bg-indigo-700 flex items-center gap-1.5";

        btnT1.className = tab === 'task1' ? activeClass : inactiveClass;
        btnT2.className = tab === 'task2' ? activeClass : inactiveClass;
        btnT3.className = tab === 'task3' ? activeClass : inactiveClass;

        if (tab === 'task1') {
            sidebar.style.display = "flex";
            contentArea.className = "lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between min-h-[600px]";
            footer.style.display = "flex";
            loadExercise(currentExerciseIndex);
        } else if (tab === 'task2') {
            sidebar.style.display = "none";
            contentArea.className = "lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between min-h-[600px]";
            footer.style.display = "none";
            renderGrammarTheory();
        } else if (tab === 'task3') {
            sidebar.style.display = "none";
            contentArea.className = "lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between min-h-[600px]";
            footer.style.display = "none";
            renderTask3Global10();
        }
    }

    function renderSidebar() {
        const list = document.getElementById('exerciseMenuList');
        list.innerHTML = '';
        exercisesData.forEach((ex, idx) => {
            const btn = document.createElement('button');
            btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center justify-between ${idx === currentExerciseIndex ? 'bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200 shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`;
            btn.innerHTML = `<span>Phần ${ex.id}</span> <span class="text-[10px] text-slate-400"></span>`;
            btn.onclick = () => {
                currentExerciseIndex = idx;
                loadExercise(idx);
                renderSidebar();
            };
            list.appendChild(btn);
        });
    }

    function loadExercise(idx) {
        currentExerciseIndex = idx;
        renderSidebar();
        const ex = exercisesData[idx];
        const content = document.getElementById('dynamicContent');
        
        let html = `
            <div>
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">Phần ${ex.id} / 22</span>
                    <span class="text-xs text-slate-500 font-medium">${ex.questions.length} câu hỏi</span>
                </div>
                <h2 class="text-lg font-bold text-slate-800 mb-1">${ex.title}</h2>
                <p class="text-sm text-slate-500 italic mb-6">${ex.instructions}</p>
            </div>
            <div class="space-y-6">
        `;

        ex.questions.forEach((item, qIdx) => {
            const savedAns = (userAnswers[ex.id] && userAnswers[ex.id][qIdx]) !== undefined ? userAnswers[ex.id][qIdx] : '';
            html += `<div class="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-3" id="q-block-${qIdx}">`;
            html += `<p class="text-sm font-semibold text-slate-700">${item.q}</p>`;

            if (ex.type === 'fill') {
                html += `
                    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
                        <input type="text" id="input-${ex.id}-${qIdx}" value="${savedAns}" placeholder="Nhập đáp án của bạn..." 
                            class="w-full sm:w-80 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                            oninput="saveAnswer(${ex.id}, ${qIdx}, this.value)">
                        <div id="feedback-${ex.id}-${qIdx}" class="text-xs font-semibold"></div>
                    </div>
                `;
            } else if (ex.type === 'choice') {
                html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">`;
                item.options.forEach((opt, optIdx) => {
                    const isChecked = savedAns === optIdx ? 'checked' : '';
                    html += `
                        <label class="flex items-center space-x-2.5 p-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 cursor-pointer text-sm">
                            <input type="radio" name="choice-${ex.id}-${qIdx}" value="${optIdx}" ${isChecked} 
                                onchange="saveAnswer(${ex.id}, ${qIdx}, ${optIdx})" class="text-indigo-600 focus:ring-indigo-500">
                            <span>${opt}</span>
                        </label>
                    `;
                });
                html += `</div><div id="feedback-${ex.id}-${qIdx}" class="text-xs font-semibold mt-1"></div>`;
            }
            html += `</div>`;
        });

        html += `</div>`;
        content.innerHTML = html;
        lucide.createIcons();
        
        document.getElementById('prevBtn').disabled = idx === 0;
        document.getElementById('nextBtn').disabled = idx === exercisesData.length - 1;
        document.getElementById('prevBtn').style.opacity = idx === 0 ? '0.5' : '1';
        document.getElementById('nextBtn').style.opacity = idx === exercisesData.length - 1 ? '0.5' : '1';
    }

    function saveAnswer(exId, qIdx, val) {
        if (!userAnswers[exId]) userAnswers[exId] = {};
        userAnswers[exId][qIdx] = val;
    }

    function checkCurrentExercise() {
        const ex = exercisesData[currentExerciseIndex];
        let correctCount = 0;

        ex.questions.forEach((item, qIdx) => {
            const userAns = userAnswers[ex.id] && userAnswers[ex.id][qIdx];
            const feedbackDiv = document.getElementById(`feedback-${ex.id}-${qIdx}`);
            const blockDiv = document.getElementById(`q-block-${qIdx}`);

            if (ex.type === 'fill') {
                if (!userAns) {
                    feedbackDiv.innerHTML = `<span class="text-amber-600">⚠️ Chưa trả lời (Gợi ý: ${item.hint})</span>`;
                    blockDiv.className = "p-4 rounded-xl bg-amber-50/50 border border-amber-200 space-y-3";
                } else {
                    const cleanedUser = userAns.trim().toLowerCase();
                    const isCorrect = item.ans.some(a => a.toLowerCase() === cleanedUser);
                    if (isCorrect) {
                        feedbackDiv.innerHTML = `<span class="text-emerald-600">✓ Chính xác!</span>`;
                        blockDiv.className = "p-4 rounded-xl bg-emerald-50/50 border border-emerald-200 space-y-3";
                        correctCount++;
                    } else {
                        feedbackDiv.innerHTML = `<span class="text-rose-600">✗ Chưa đúng. Đáp án gợi ý: <b>${item.ans[0]}</b> (${item.hint})</span>`;
                        blockDiv.className = "p-4 rounded-xl bg-rose-50/50 border border-rose-200 space-y-3";
                    }
                }
            } else if (ex.type === 'choice') {
                if (userAns === undefined || userAns === '') {
                    feedbackDiv.innerHTML = `<span class="text-amber-600">⚠️ Chưa chọn đáp án.</span>`;
                    blockDiv.className = "p-4 rounded-xl bg-amber-50/50 border border-amber-200 space-y-3";
                } else {
                    if (Number(userAns) === item.correct) {
                        feedbackDiv.innerHTML = `<span class="text-emerald-600">✓ Chính xác!</span>`;
                        blockDiv.className = "p-4 rounded-xl bg-emerald-50/50 border border-emerald-200 space-y-3";
                        correctCount++;
                    } else {
                        feedbackDiv.innerHTML = `<span class="text-rose-600">✗ Chưa đúng. Đáp án đúng là: <b>${item.options[item.correct]}</b></span>`;
                        blockDiv.className = "p-4 rounded-xl bg-rose-50/50 border border-rose-200 space-y-3";
                    }
                }
            }
        });

        alert(`Kết quả phần ${ex.id}: ${correctCount} / ${ex.questions.length} câu đúng.`);
    }

    function resetCurrentExercise() {
        const ex = exercisesData[currentExerciseIndex];
        if (userAnswers[ex.id]) {
            userAnswers[ex.id] = {};
        }
        loadExercise(currentExerciseIndex);
    }

    function prevExercise() {
        if (currentExerciseIndex > 0) {
            currentExerciseIndex--;
            loadExercise(currentExerciseIndex);
        }
    }

    function nextExercise() {
        if (currentExerciseIndex < exercisesData.length - 1) {
            currentExerciseIndex++;
            loadExercise(currentExerciseIndex);
        }
    }

    function renderGrammarTheory() {
        const content = document.getElementById('dynamicContent');
        content.innerHTML = `

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <h3 class="font-bold text-indigo-700 flex items-center gap-2">
                            <i data-lucide="git-branch" class="w-5 h-5"></i> 1. Câu điều kiện (Conditional Sentences)
                        </h3>
                        <ul class="text-sm space-y-2 text-slate-600">
                            <li><b>Loại 1 (Có thể xảy ra ở hiện tại/tương lai):</b><br><code class="text-xs bg-white p-1 rounded border">If + S + V(present), S + will / can / may + V-inf</code></li>
                            <li><b>Loại 2 (Trái với thực tế hiện tại):</b><br><code class="text-xs bg-white p-1 rounded border">If + S + V2/ed (were), S + would / could + V-inf</code></li>
                            <li><b>Loại 3 (Trái với thực tế quá khứ):</b><br><code class="text-xs bg-white p-1 rounded border">If + S + had + V3/ed, S + would have + V3/ed</code></li>
                            <li><b>Unless:</b> Bằng nghĩa với <code class="text-xs bg-white p-1 rounded border">If ... not</code>.</li>
                        </ul>
                    </div>

                    <div class="p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <h3 class="font-bold text-indigo-700 flex items-center gap-2">
                            <i data-lucide="shield" class="w-5 h-5"></i> 2. Thể bị động (Passive Voice)
                        </h3>
                        <ul class="text-sm space-y-2 text-slate-600">
                            <li><b>Công thức chung:</b> <code class="text-xs bg-white p-1 rounded border">S + Be + V3/ed (+ by O)</code></li>
                            <li><b>Hiện tại đơn:</b> am/is/are + V3/ed</li>
                            <li><b>Quá khứ đơn:</b> was/were + V3/ed</li>
                            <li><b>Tương lai đơn:</b> will be + V3/ed</li>
                            <li><b>Tiếp diễn (HT/QK):</b> am/is/are/was/were + being + V3/ed</li>
                            <li><b>Hoàn thành (HTHT):</b> have/has been + V3/ed</li>
                        </ul>
                    </div>

                    <div class="p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <h3 class="font-bold text-indigo-700 flex items-center gap-2">
                            <i data-lucide="zap" class="w-5 h-5"></i> 3. Động từ nguyên thể & V-ing (Infinitives & Gerunds)
                        </h3>
                        <ul class="text-sm space-y-2 text-slate-600">
                            <li><b>To-Infinitive:</b> Sau các động từ như want, refuse, agree, arrange, offer, decide, learn, hope...</li>
                            <li><b>Bare-Infinitive (Không to):</b> Sau modal verbs (can, must, will...), let, make, help.</li>
                            <li><b>Gerund (V-ing):</b> Sau enjoy, finish, stop, avoid, mind, admit... hoặc sau giới từ.</li>
                        </ul>
                    </div>

                    <div class="p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <h3 class="font-bold text-indigo-700 flex items-center gap-2">
                            <i data-lucide="users" class="w-5 h-5"></i> 4. Thể sai khiến (Causative Verbs)
                        </h3>
                        <ul class="text-sm space-y-2 text-slate-600">
                            <li><b>Make / Let / Help:</b><br><code class="text-xs bg-white p-1 rounded border">S + make/let + sb + V-inf</code></li>
                            <li><b>Have / Get:</b><br><code class="text-xs bg-white p-1 rounded border">S + have + sb + V-inf = S + get + sb + to V</code></li>
                            <li><b>Force / Convince / Encourage / Tell:</b><br><code class="text-xs bg-white p-1 rounded border">S + force/convince/tell + sb + to V</code></li>
                        </ul>
                    </div>
                </div>
            </div>

    window.onload = initApp;
</script>

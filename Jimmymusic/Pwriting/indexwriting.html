<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Computer-Based Writing Test</title>
    <link rel="stylesheet" href="style-writing.css">
</head>
<body>
    <header class="top-header">
        <div class="user-id">IELTS Writing - Practice </div>
        
        <div class="header-controls">
            <div class="font-controls">
                <button class="header-btn" onclick="changeFontSize('increase')">A+</button>
                <button class="header-btn" onclick="changeFontSize('decrease')">A-</button>
                <button class="header-btn" onclick="changeFontSize('reset')">Reset</button>
            </div>
            <button class="header-btn" id="reset-btn" onclick="resetTest()">Reset All</button>
            <button class="header-btn" id="reload-btn" onclick="reloadData()">Reload</button>
            <button class="header-btn hide-btn" id="submit-btn" onclick="finishTest()">Submit</button>
        </div>
    </header>

    <div class="part-time-banner">
        <div class="part-label">
            <h1>Part 1</h1>
            <p>You should spend about 20 minutes on this task. Write at least 150 words.</p>
        </div>
        <div class="timer-display">
            <!-- Đã cập nhật giá trị mặc định thành 00:00 -->
            <span id="timer">00:00</span>
        </div>
    </div>

<main class="test-container">
    <div id="prompt-pane" class="pane">
        <div class="custom-prompt-wrapper">
            <div class="custom-prompt-header">
                <span><strong>Đề bài (Dán chữ hoặc Ctrl+V dán ảnh):</strong></span>
                <button class="btn-small" onclick="clearCustomPrompt()">Xóa đề</button>
            </div>
            <div 
                id="custom-prompt-area" 
                contenteditable="true" 
                placeholder="Dán chữ hoặc bấm Ctrl+V để dán ảnh đề bài vào đây..."
            ></div>
        </div>

        <!-- KHUNG NÚT TEMPLATE MẪU -->
        <div class="template-wrapper">
            <div class="template-title"><strong>Templates:</strong></div>
            
            <!-- Bộ nút dành riêng cho Part 1 -->
          <!-- Bộ nút dành riêng cho Part 1 -->
<div id="templates-part1" class="template-group">
    <button class="template-btn" onclick="applyTemplate('chart_time')">Chart (Time)</button>
    <button class="template-btn" onclick="applyTemplate('chart_trend')">Chart (Trend)</button>
    <button class="template-btn" onclick="applyTemplate('process_manmade')">Process (Man-made)</button>
    <button class="template-btn" onclick="applyTemplate('process_natural')">Process (Natural)</button>
    <button class="template-btn" onclick="applyTemplate('map')">Map</button>
</div>

            <!-- Bộ nút dành riêng cho Part 2 -->
            <div id="templates-part2" class="template-group" style="display: none;">
                <button class="template-btn" onclick="applyTemplate('band5_65')">Bao Tran</button>
                <button class="template-btn" onclick="applyTemplate('band65_plus')">Minh Phuc</button>
                <button class="template-btn" onclick="applyTemplate('nhat_huy')">Nhat Huy</button>
                <button class="template-btn" onclick="applyTemplate('dang_khoa')">Dang Khoa</button>
                <button class="template-btn" onclick="applyTemplate('band80')">Lan Anh</button>
                <button class="template-btn" onclick="applyTemplate('band80')">Thuy Chi</button>
            </div>
        </div>

   <!-- KHUNG TỪ VỰNG & COLLOCATIONS HỖ TRỢ -->
<div class="vocab-wrapper">
    <div class="vocab-header">
        <span><strong>Từ vựng & Collocations (Bấm để chèn):</strong></span>
    </div>

    <!-- Bộ nút từ vựng cho Part 1 -->
    <div id="vocab-part1" class="vocab-nav">
        <button class="vocab-tab-btn" onclick="toggleVocab('chart', event)">Chart</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('map', event)">Map</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('process', event)">Process</button>
    </div>

    <!-- Bộ nút Collocations cho Part 2 -->
    <div id="vocab-part2" class="vocab-nav" style="display: none;">
        <button class="vocab-tab-btn" onclick="toggleVocab('education', event)">Education</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('government', event)">Government</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('technology', event)">Technology</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('health', event)">Health</button>
        <button class="vocab-tab-btn" onclick="toggleVocab('environment', event)">Environment</button>
    </div>
    
    <!-- Khung chứa nội dung từ vựng hiển thị -->
    <div id="vocab-display" class="vocab-display-area" style="display: none;"></div>
</div>
    </div>

    <div id="response-pane" class="pane">
        <textarea id="writing-area" placeholder="Type your answer here..."></textarea>
    </div>
</main>

    <footer class="test-footer">
        <div class="task-navigation">
            <button class="nav-btn active" id="btn-task1" onclick="switchTask(1)">Part 1</button>
            <button class="nav-btn" id="btn-task2" onclick="switchTask(2)">Part 2</button>
        </div>
        <div class="word-count-display">Word count: <strong id="word-count">0</strong></div>
        <div class="footer-right"></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
